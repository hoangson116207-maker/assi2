<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên Hệ & Tư Vấn - TechGear</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo"><a href="index.html">TechGear</a></div>
            <ul class="nav-links">
                <li><a href="index.html">Trang chủ</a></li>
                <li><a href="products.html">Sản phẩm</a></li>
                <li><a href="contact.html" class="active">Liên hệ</a></li>
                <li><a href="feedback.html">Góp ý</a></li>
            </ul>
        </nav>
    </header>

    <main class="container">
        <h2 class="section-title">Liên Hệ & Hỗ Trợ Kỹ Thuật</h2>

        <div class="form-box">
            <form onsubmit="event.preventDefault(); alert('Cảm ơn bạn! Yêu cầu tư vấn đã được gửi đi.');">
                <div class="form-group">
                    <label>Họ và tên:</label>
                    <input type="text" placeholder="Nguyễn Văn A" required>
                </div>
                <div class="form-group">
                    <label>Email liên lạc:</label>
                    <input type="email" placeholder="email@gmail.com" required>
                </div>
                <div class="form-group">
                    <label>Chủ đề cần hỗ trợ:</label>
                    <select>
                        <option>Tư vấn chọn bàn phím cơ</option>
                        <option>Tư vấn combo chuột & lót chuột</option>
                        <option>Setup trọn gói góc máy làm việc</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Nội dung cần trao đổi:</label>
                    <textarea rows="4" placeholder="Mô tả nhu cầu góc máy của bạn..." required></textarea>
                </div>
                <button type="submit" class="btn" style="width: 100%;">Gửi Yêu Cầu</button>
            </form>

            <div style="margin-top: 30px; line-height: 1.8;">
                <p>📍 <strong>Địa chỉ cửa hàng:</strong> Số 1 Trịnh Văn Bô, Nam Từ Liêm, Hà Nội</p>
                <p>📞 <strong>Hotline:</strong> 0987.654.321 | ✉️ <strong>Email:</strong> contact@techgear.vn</p>
            </div>

            <!-- Bản đồ Google Maps nhúng iframe -->
            <div style="margin-top: 20px; border-radius: 8px; overflow: hidden;">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3723.863981044336!2d105.74459841540232!3d21.038127792833076!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x313454b991d80fd5%3A0xa70c67924612e86e!2zVHLGsOG7nW5nIENhbyDEkeG6s25nIEZQVCBQb2x5dGVjaG5pYw!5e0!3m2!1svi!2s!4v1655000000000!5m2!1svi!2s" 
                    width="100%" height="220" style="border:0;" allowfullscreen="" loading="lazy">
                </iframe>
            </div>
        </div>
    </main>

    <footer>
        <p>© 2026 TechGear - Bản quyền thuộc về Nguyễn Hoàng Sơn (PH64882).</p>
    </footer>
</body>
</html>
